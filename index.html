<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>瘦了么</title>
    <style>
        :root {
            --apple: #7CB342;
            --apple-light: #AED581;
            --apple-dark: #558B2F;
            --cream: #FFF8E1;
            --cream-dark: #F5E6C8;
            --text: #4E342E;
            --text-light: #8D6E63;
            --card-bg: #FFFFFF;
            --shadow: rgba(126, 182, 76, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #F1F8E9 0%, #FFF8E1 100%);
            min-height: 100vh;
            color: var(--text);
            padding-bottom: 100px;
        }

        .header {
            background: linear-gradient(135deg, var(--apple) 0%, var(--apple-dark) 100%);
            color: white;
            padding: 24px 20px;
            text-align: center;
            box-shadow: 0 4px 20px var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }

        .header .subtitle {
            font-size: 13px;
            opacity: 0.9;
        }

        .header .count {
            margin-top: 10px;
            font-size: 14px;
            background: rgba(255,255,255,0.2);
            display: inline-block;
            padding: 4px 16px;
            border-radius: 20px;
        }

        .toolbar {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 16px;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            padding: 10px 20px;
            border-radius: 24px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--apple) 0%, var(--apple-dark) 100%);
            color: white;
            box-shadow: 0 4px 12px var(--shadow);
        }

        .btn-primary:active {
            transform: scale(0.95);
        }

        .btn-cream {
            background: var(--cream);
            color: var(--apple-dark);
            border: 1px solid var(--apple-light);
        }

        .btn-cream:active {
            background: var(--cream-dark);
        }

        .fab {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--apple) 0%, var(--apple-dark) 100%);
            color: white;
            border: none;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(126, 182, 76, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 90;
            transition: transform 0.3s ease;
        }

        .fab:active {
            transform: scale(0.9) rotate(90deg);
        }

        .cards-container {
            padding: 0 16px 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-width: 600px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 18px 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            border-left: 4px solid var(--apple);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .card:active {
            transform: scale(0.98);
        }

        .card-date {
            font-size: 12px;
            color: var(--text-light);
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-date .weekday {
            background: var(--cream);
            color: var(--apple-dark);
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
        }

        .card-body {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .card-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
        }

        .card-item .label {
            color: var(--text-light);
            font-size: 12px;
        }

        .card-item .value {
            color: var(--apple-dark);
            font-weight: 600;
            font-size: 15px;
        }

        .card-thought {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed var(--cream-dark);
            font-size: 14px;
            color: var(--text);
            line-height: 1.6;
        }

        .card-custom {
            margin-top: 8px;
            font-size: 13px;
            color: var(--text-light);
        }

        .card-actions {
            position: absolute;
            top: 14px;
            right: 14px;
            display: flex;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .card:hover .card-actions,
        .card-actions.visible {
            opacity: 1;
        }

        .card-actions button {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .btn-edit {
            background: var(--cream);
            color: var(--apple-dark);
        }

        .btn-delete {
            background: #FFEBEE;
            color: #C62828;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            display: none;
            align-items: flex-end;
            justify-content: center;
            z-index: 200;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: white;
            width: 100%;
            max-width: 480px;
            border-radius: 24px 24px 0 0;
            padding: 24px 20px 32px;
            animation: slideUp 0.3s ease;
            max-height: 90vh;
            overflow-y: auto;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--apple-dark);
            margin-bottom: 20px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            color: var(--text-light);
            margin-bottom: 6px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--cream-dark);
            border-radius: 14px;
            font-size: 15px;
            color: var(--text);
            background: var(--cream);
            transition: border-color 0.3s;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--apple);
            background: white;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .custom-fields {
            margin-top: 12px;
        }

        .custom-field-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }

        .custom-field-row input {
            flex: 1;
            padding: 10px 14px;
            border: 2px solid var(--cream-dark);
            border-radius: 12px;
            font-size: 14px;
            background: var(--cream);
        }

        .custom-field-row input:focus {
            outline: none;
            border-color: var(--apple);
            background: white;
        }

        .btn-remove-custom {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: #FFEBEE;
            color: #C62828;
            cursor: pointer;
            font-size: 16px;
            flex-shrink: 0;
        }

        .btn-add-custom {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            padding: 10px;
            border: 2px dashed var(--apple-light);
            border-radius: 14px;
            background: transparent;
            color: var(--apple-dark);
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .btn-add-custom:active {
            background: var(--cream);
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .modal-actions .btn {
            flex: 1;
            justify-content: center;
            padding: 14px;
            font-size: 16px;
            border-radius: 16px;
        }

        .btn-cancel {
            background: #f5f5f5;
            color: var(--text-light);
        }

        .chart-modal .modal {
            max-height: 85vh;
            border-radius: 24px;
            margin: 20px;
            width: calc(100% - 40px);
        }

        .chart-controls {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .chart-controls .btn {
            padding: 8px 16px;
            font-size: 13px;
        }

        .chart-controls .btn.active {
            background: var(--apple);
            color: white;
        }

        .chart-container {
            background: var(--cream);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            position: relative;
            height: 280px;
        }

        .chart-container canvas {
            width: 100%;
            height: 100%;
        }

        .chart-legend {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
            font-size: 12px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-light);
        }

        .empty-state .icon {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-state p {
            font-size: 16px;
        }

        .search-bar {
            padding: 0 16px 12px;
            max-width: 600px;
            margin: 0 auto;
        }

        .search-bar input {
            width: 100%;
            padding: 12px 18px;
            border: 2px solid var(--cream-dark);
            border-radius: 24px;
            font-size: 15px;
            background: white;
            color: var(--text);
        }

        .search-bar input:focus {
            outline: none;
            border-color: var(--apple);
        }

        .photo-upload-area {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 8px;
        }

        .photo-preview {
            width: 72px;
            height: 72px;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            border: 2px solid var(--cream-dark);
        }

        .photo-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .photo-preview .remove-photo {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: rgba(0,0,0,0.5);
            color: white;
            border: none;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        .btn-add-photo {
            width: 72px;
            height: 72px;
            border: 2px dashed var(--apple-light);
            border-radius: 12px;
            background: var(--cream);
            color: var(--apple-dark);
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-photos {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .card-photos img {
            width: 72px;
            height: 72px;
            border-radius: 10px;
            object-fit: cover;
            border: 1px solid var(--cream-dark);
        }

        .btn-checkin {
            background: #E8F5E9;
            color: var(--apple-dark);
        }

        .checkin-modal {
            align-items: center;
        }

        .checkin-modal .modal {
            border-radius: 24px;
            margin: 20px;
            width: calc(100% - 40px);
            max-width: 420px;
        }

        .checkin-modal img {
            width: 100%;
            border-radius: 16px;
            display: block;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
        }

        .checkin-tip {
            text-align: center;
            font-size: 13px;
            color: var(--text-light);
            margin-top: 12px;
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 24px;
            }
            .card-body {
                grid-template-columns: 1fr;
            }
            .chart-container {
                height: 220px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>瘦了么</h1>
        <div class="subtitle">记录每一天的蜕变</div>
        <div class="count" id="cardCount">已有 0 张记录卡片</div>
    </div>

    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="搜索日期或内容...">
    </div>

    <div class="toolbar">
        <button class="btn btn-primary" onclick="openChart()">数据曲线</button>
    </div>

    <div class="cards-container" id="cardsContainer">
        <div class="empty-state" id="emptyState">
            <div class="icon">🍏</div>
            <p>还没有记录，点击右下角加号开始吧~</p>
        </div>
    </div>

    <button class="fab" onclick="openModal()">+</button>

    <!-- 编辑卡片弹窗 -->
    <div class="modal-overlay" id="cardModal">
        <div class="modal">
            <div class="modal-title" id="modalTitle">新建记录</div>
            <div class="form-group">
                <label>日期</label>
                <input type="date" id="inputDate">
            </div>
            <div class="form-group">
                <label>今日体重 (kg)</label>
                <input type="number" id="inputWeight" step="0.1" placeholder="例如: 55.5">
            </div>
            <div class="form-group">
                <label>胸围 (cm)</label>
                <input type="number" id="inputBust" step="0.1" placeholder="例如: 85">
            </div>
            <div class="form-group">
                <label>腰围 (cm)</label>
                <input type="number" id="inputWaist" step="0.1" placeholder="例如: 65">
            </div>
            <div class="form-group">
                <label>臀围 (cm)</label>
                <input type="number" id="inputHip" step="0.1" placeholder="例如: 90">
            </div>
            <div class="form-group">
                <label>今日感想</label>
                <textarea id="inputThought" placeholder="写下今天的感受..."></textarea>
            </div>
            <div class="form-group">
                <label>图片记录</label>
                <div class="photo-upload-area" id="photoUploadArea">
                    <button class="btn-add-photo" onclick="document.getElementById('photoInput').click()">+</button>
                    <input type="file" id="photoInput" accept="image/*" multiple style="display:none" onchange="handlePhotoSelect(event)">
                </div>
            </div>
            <div class="form-group">
                <label>自定义记录</label>
                <div class="custom-fields" id="customFields"></div>
                <button class="btn-add-custom" onclick="addCustomField()">
                    <span>+</span> 添加自定义项
                </button>
            </div>
            <div class="modal-actions">
                <button class="btn btn-cancel" onclick="closeModal()">取消</button>
                <button class="btn btn-primary" onclick="saveCard()">保存</button>
            </div>
        </div>
    </div>

    <!-- 图表弹窗 -->
    <div class="modal-overlay chart-modal" id="chartModal">
        <div class="modal">
            <div class="modal-title">数据变化曲线</div>
            <div class="chart-controls" id="metricControls">
                <button class="btn btn-cream active" onclick="setChartMetric('weight')" data-metric="weight">体重</button>
                <button class="btn btn-cream" onclick="setChartMetric('bust')" data-metric="bust">胸围</button>
                <button class="btn btn-cream" onclick="setChartMetric('waist')" data-metric="waist">腰围</button>
                <button class="btn btn-cream" onclick="setChartMetric('hip')" data-metric="hip">臀围</button>
            </div>
            <div class="chart-controls">
                <button class="btn btn-cream active" onclick="setChartMode('day')" id="btnDay">按日</button>
                <button class="btn btn-cream" onclick="setChartMode('week')" id="btnWeek">按周</button>
                <button class="btn btn-cream" onclick="setChartMode('month')" id="btnMonth">按月</button>
            </div>
            <div class="chart-container">
                <canvas id="chartCanvas"></canvas>
            </div>
            <div class="modal-actions">
                <button class="btn btn-cancel" onclick="closeChart()">关闭</button>
            </div>
        </div>
    </div>

    <!-- 打卡图片预览弹窗 -->
    <div class="modal-overlay checkin-modal" id="checkinModal">
        <div class="modal">
            <div class="modal-title">打卡图片</div>
            <img id="checkinImage" alt="打卡图片">
            <div class="checkin-tip">长按图片可保存到相册</div>
            <div class="modal-actions">
                <button class="btn btn-cancel" onclick="closeCheckin()">关闭</button>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'shouleme_cards';
        let cards = [];
        let editingId = null;
        let chartMode = 'day';
        let chartMetric = 'weight';
        let customFieldCount = 0;

        function loadCards() {
            const data = localStorage.getItem(STORAGE_KEY);
            if (data) {
                try { cards = JSON.parse(data); } catch(e) { cards = []; }
            }
            renderCards();
        }

        function saveCards() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(cards));
            renderCards();
        }

        function renderCards(list = cards) {
            const container = document.getElementById('cardsContainer');
            const empty = document.getElementById('emptyState');
            const countEl = document.getElementById('cardCount');
            countEl.textContent = `已有 ${cards.length} 张记录卡片`;

            if (list.length === 0) {
                container.innerHTML = '';
                container.appendChild(empty || createEmptyState());
                return;
            }

            container.innerHTML = '';
            list.forEach(card => {
                const el = document.createElement('div');
                el.className = 'card';
                const date = new Date(card.date);
                const weekdays = ['周日','周一','周二','周三','周四','周五','周六'];
                const customHtml = card.custom && card.custom.length > 0
                    ? card.custom.map(c => `<div class="card-custom">${escapeHtml(c.label)}: ${escapeHtml(c.value)}</div>`).join('')
                    : '';
                const photosHtml = card.photos && card.photos.length > 0
                    ? `<div class="card-photos">${card.photos.map((p, i) => `<img src="${p}" onclick="event.stopPropagation(); previewPhoto('${card.id}', ${i})">`).join('')}</div>`
                    : '';
                el.innerHTML = `
                    <div class="card-date">
                        <span>${card.date} <span class="weekday">${weekdays[date.getDay()]}</span></span>
                        <div class="card-actions visible">
                            <button class="btn-checkin" onclick="event.stopPropagation(); checkinCard('${card.id}')">打卡</button>
                            <button class="btn-edit" onclick="event.stopPropagation(); editCard('${card.id}')">✏️</button>
                            <button class="btn-delete" onclick="event.stopPropagation(); deleteCard('${card.id}')">🗑️</button>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="card-item"><span class="label">体重</span><span class="value">${card.weight ? card.weight + ' kg' : '-'}</span></div>
                        <div class="card-item"><span class="label">胸围</span><span class="value">${card.bust ? card.bust + ' cm' : '-'}</span></div>
                        <div class="card-item"><span class="label">腰围</span><span class="value">${card.waist ? card.waist + ' cm' : '-'}</span></div>
                        <div class="card-item"><span class="label">臀围</span><span class="value">${card.hip ? card.hip + ' cm' : '-'}</span></div>
                    </div>
                    ${card.thought ? `<div class="card-thought">${escapeHtml(card.thought)}</div>` : ''}
                    ${customHtml}
                    ${photosHtml}
                `;
                container.appendChild(el);
            });
        }

        function createEmptyState() {
            const div = document.createElement('div');
            div.className = 'empty-state';
            div.id = 'emptyState';
            div.innerHTML = '<div class="icon">🍏</div><p>还没有记录，点击右下角加号开始吧~</p>';
            return div;
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function openModal(id = null) {
            editingId = id;
            document.getElementById('modalTitle').textContent = id ? '编辑记录' : '新建记录';
            document.getElementById('customFields').innerHTML = '';
            customFieldCount = 0;
            resetPhotoArea();

            if (id) {
                const card = cards.find(c => c.id === id);
                if (!card) return;
                document.getElementById('inputDate').value = card.date;
                document.getElementById('inputWeight').value = card.weight || '';
                document.getElementById('inputBust').value = card.bust || '';
                document.getElementById('inputWaist').value = card.waist || '';
                document.getElementById('inputHip').value = card.hip || '';
                document.getElementById('inputThought').value = card.thought || '';
                if (card.custom) {
                    card.custom.forEach(c => addCustomField(c.label, c.value));
                }
                if (card.photos) {
                    card.photos.forEach(p => addPhotoPreview(p));
                }
            } else {
                document.getElementById('inputDate').value = new Date().toISOString().split('T')[0];
                document.getElementById('inputWeight').value = '';
                document.getElementById('inputBust').value = '';
                document.getElementById('inputWaist').value = '';
                document.getElementById('inputHip').value = '';
                document.getElementById('inputThought').value = '';
            }
            document.getElementById('cardModal').classList.add('active');
        }

        function resetPhotoArea() {
            const area = document.getElementById('photoUploadArea');
            area.querySelectorAll('.photo-preview').forEach(el => el.remove());
            document.getElementById('photoInput').value = '';
        }

        function handlePhotoSelect(event) {
            const files = Array.from(event.target.files);
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = e => compressImage(e.target.result, addPhotoPreview);
                reader.readAsDataURL(file);
            });
            event.target.value = '';
        }

        function compressImage(dataUrl, callback) {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const MAX = 800;
                let w = img.width, h = img.height;
                if (w > MAX || h > MAX) {
                    if (w > h) { h = h * MAX / w; w = MAX; }
                    else { w = w * MAX / h; h = MAX; }
                }
                canvas.width = w;
                canvas.height = h;
                canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                callback(canvas.toDataURL('image/jpeg', 0.7));
            };
            img.src = dataUrl;
        }

        function addPhotoPreview(dataUrl) {
            const area = document.getElementById('photoUploadArea');
            const addBtn = area.querySelector('.btn-add-photo');
            const div = document.createElement('div');
            div.className = 'photo-preview';
            div.innerHTML = `
                <img src="${dataUrl}">
                <button class="remove-photo" onclick="event.preventDefault(); this.parentElement.remove()">×</button>
            `;
            area.insertBefore(div, addBtn);
        }

        function previewPhoto(cardId, idx) {
            const card = cards.find(c => c.id === cardId);
            if (!card || !card.photos || !card.photos[idx]) return;
            const win = window.open();
            win.document.write(`<img src="${card.photos[idx]}" style="max-width:100%;">`);
        }

        function closeModal() {
            document.getElementById('cardModal').classList.remove('active');
            editingId = null;
        }

        function addCustomField(label = '', value = '') {
            const container = document.getElementById('customFields');
            const row = document.createElement('div');
            row.className = 'custom-field-row';
            const idx = customFieldCount++;
            row.innerHTML = `
                <input type="text" placeholder="项目名" id="customLabel_${idx}" value="${escapeHtml(label)}">
                <input type="text" placeholder="数值" id="customValue_${idx}" value="${escapeHtml(value)}">
                <button class="btn-remove-custom" onclick="this.parentElement.remove()">×</button>
            `;
            container.appendChild(row);
        }

        function saveCard() {
            const date = document.getElementById('inputDate').value;
            if (!date) { alert('请选择日期'); return; }

            const custom = [];
            document.querySelectorAll('.custom-field-row').forEach(row => {
                const label = row.querySelector('input[placeholder="项目名"]').value.trim();
                const value = row.querySelector('input[placeholder="数值"]').value.trim();
                if (label && value) custom.push({ label, value });
            });

            const photos = [];
            document.querySelectorAll('#photoUploadArea .photo-preview img').forEach(img => {
                photos.push(img.src);
            });

            const card = {
                id: editingId || Date.now().toString(),
                date,
                weight: parseFloat(document.getElementById('inputWeight').value) || null,
                bust: parseFloat(document.getElementById('inputBust').value) || null,
                waist: parseFloat(document.getElementById('inputWaist').value) || null,
                hip: parseFloat(document.getElementById('inputHip').value) || null,
                thought: document.getElementById('inputThought').value.trim(),
                custom,
                photos
            };

            if (editingId) {
                const idx = cards.findIndex(c => c.id === editingId);
                if (idx >= 0) cards[idx] = card;
            } else {
                cards.push(card);
            }

            cards.sort((a, b) => new Date(b.date) - new Date(a.date));
            saveCards();
            closeModal();
        }

        function editCard(id) { openModal(id); }

        function deleteCard(id) {
            if (!confirm('确定要删除这张记录卡片吗？')) return;
            cards = cards.filter(c => c.id !== id);
            saveCards();
        }

        function checkinCard(id) {
            const card = cards.find(c => c.id === id);
            if (!card) return;

            const photos = card.photos && card.photos.length ? card.photos.slice(0, 3) : [];
            const W = 500;
            const photoAreaH = photos.length ? 190 : 0;
            const H = 640 + photoAreaH;

            Promise.all(photos.map(p => new Promise(resolve => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = () => resolve(null);
                img.src = p;
            }))).then(images => {
                const canvas = document.createElement('canvas');
                canvas.width = W; canvas.height = H;
                const ctx = canvas.getContext('2d');

                ctx.fillStyle = '#F1F8E9';
                ctx.fillRect(0, 0, W, H);

                ctx.fillStyle = '#7CB342';
                ctx.fillRect(0, 0, W, 90);
                ctx.fillStyle = 'white';
                ctx.font = 'bold 28px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('瘦了么 · 每日打卡', W/2, 42);
                ctx.font = '14px sans-serif';
                ctx.fillText(card.date, W/2, 70);

                const date = new Date(card.date);
                const weekdays = ['周日','周一','周二','周三','周四','周五','周六'];
                ctx.fillStyle = '#558B2F';
                ctx.font = '16px sans-serif';
                ctx.fillText(weekdays[date.getDay()], W/2, 115);

                const items = [
                    ['体重', card.weight ? card.weight + ' kg' : '-'],
                    ['胸围', card.bust ? card.bust + ' cm' : '-'],
                    ['腰围', card.waist ? card.waist + ' cm' : '-'],
                    ['臀围', card.hip ? card.hip + ' cm' : '-']
                ];
                const colW = W / 2;
                items.forEach((item, i) => {
                    const x = (i % 2) * colW + colW / 2;
                    const y = 170 + Math.floor(i / 2) * 80;
                    ctx.fillStyle = '#8D6E63';
                    ctx.font = '14px sans-serif';
                    ctx.fillText(item[0], x, y);
                    ctx.fillStyle = '#558B2F';
                    ctx.font = 'bold 22px sans-serif';
                    ctx.fillText(item[1], x, y + 32);
                });

                if (card.thought) {
                    ctx.fillStyle = '#4E342E';
                    ctx.font = '15px sans-serif';
                    const lines = wrapText(ctx, card.thought, W - 80);
                    lines.slice(0, 4).forEach((line, i) => {
                        ctx.fillText(line, W/2, 350 + i * 26);
                    });
                }

                const validImages = images.filter(Boolean);
                if (validImages.length) {
                    const size = 150, gap = 20;
                    const totalW = validImages.length * size + (validImages.length - 1) * gap;
                    let startX = (W - totalW) / 2;
                    const photoY = 460;
                    validImages.forEach(img => {
                        ctx.save();
                        roundRect(ctx, startX, photoY, size, size, 16);
                        ctx.clip();
                        const scale = Math.max(size / img.width, size / img.height);
                        const sw = img.width * scale, sh = img.height * scale;
                        ctx.drawImage(img, startX + (size - sw) / 2, photoY + (size - sh) / 2, sw, sh);
                        ctx.restore();
                        startX += size + gap;
                    });
                }

                ctx.fillStyle = '#8D6E63';
                ctx.font = '12px sans-serif';
                ctx.fillText('坚持记录，遇见更好的自己 🍏', W/2, H - 30);

                document.getElementById('checkinImage').src = canvas.toDataURL('image/png');
                document.getElementById('checkinModal').classList.add('active');
            });
        }

        function closeCheckin() {
            document.getElementById('checkinModal').classList.remove('active');
        }

        function roundRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
        }

        function wrapText(ctx, text, maxWidth) {
            const lines = [];
            let line = '';
            for (let char of text) {
                if (ctx.measureText(line + char).width > maxWidth) {
                    lines.push(line);
                    line = char;
                } else {
                    line += char;
                }
            }
            if (line) lines.push(line);
            return lines;
        }

        document.getElementById('searchInput').addEventListener('input', function() {
            const kw = this.value.trim().toLowerCase();
            if (!kw) { renderCards(); return; }
            const filtered = cards.filter(c => {
                return c.date.includes(kw) ||
                    (c.thought && c.thought.toLowerCase().includes(kw)) ||
                    (c.custom && c.custom.some(x => x.label.toLowerCase().includes(kw) || x.value.toLowerCase().includes(kw)));
            });
            renderCards(filtered);
        });

        function openChart() {
            document.getElementById('chartModal').classList.add('active');
            drawChart();
        }

        function closeChart() {
            document.getElementById('chartModal').classList.remove('active');
        }

        function setChartMode(mode) {
            chartMode = mode;
            ['day','week','month'].forEach(m => {
                document.getElementById('btn' + m.charAt(0).toUpperCase() + m.slice(1)).classList.toggle('active', m === mode);
            });
            drawChart();
        }

        function setChartMetric(metric) {
            chartMetric = metric;
            document.querySelectorAll('#metricControls .btn').forEach(b => {
                b.classList.toggle('active', b.dataset.metric === metric);
            });
            drawChart();
        }

        function drawChart() {
            const canvas = document.getElementById('chartCanvas');
            const ctx = canvas.getContext('2d');
            const rect = canvas.parentElement.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
            const W = rect.width, H = rect.height;
            ctx.clearRect(0, 0, W, H);

            if (cards.length < 1) {
                ctx.fillStyle = '#8D6E63';
                ctx.font = '14px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('暂无数据，请先添加记录', W/2, H/2);
                return;
            }

            const grouped = groupData(chartMode);
            const labels = grouped.labels;
            const data = grouped.data;
            const metricInfo = {
                weight: { color: '#7CB342', name: '体重 (kg)' },
                bust:   { color: '#FFB74D', name: '胸围 (cm)' },
                waist:  { color: '#4FC3F7', name: '腰围 (cm)' },
                hip:    { color: '#F06292', name: '臀围 (cm)' }
            };
            const info = metricInfo[chartMetric];
            const pts = data[chartMetric];

            const pad = { top: 30, right: 20, bottom: 40, left: 40 };
            const chartW = W - pad.left - pad.right;
            const chartH = H - pad.top - pad.bottom;

            let minVal = Infinity, maxVal = -Infinity;
            pts.forEach(v => {
                if (v != null) { minVal = Math.min(minVal, v); maxVal = Math.max(maxVal, v); }
            });
            if (minVal === Infinity) {
                ctx.fillStyle = '#8D6E63';
                ctx.font = '14px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(`暂无${info.name}数据`, W/2, H/2);
                return;
            }
            const range = maxVal - minVal || 1;
            minVal = Math.max(0, minVal - range * 0.1);
            maxVal = maxVal + range * 0.1;

            ctx.strokeStyle = '#E0E0E0';
            ctx.lineWidth = 1;
            for (let i = 0; i <= 4; i++) {
                const y = pad.top + chartH * i / 4;
                ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(W - pad.right, y); ctx.stroke();
                ctx.fillStyle = '#8D6E63';
                ctx.font = '11px sans-serif';
                ctx.textAlign = 'right';
                const val = maxVal - (maxVal - minVal) * i / 4;
                ctx.fillText(val.toFixed(1), pad.left - 6, y + 4);
            }

            // 指标名称
            ctx.fillStyle = info.color;
            ctx.font = 'bold 14px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(info.name, W/2, 18);

            const stepX = labels.length > 1 ? chartW / (labels.length - 1) : chartW;
            ctx.strokeStyle = info.color;
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            let started = false;
            pts.forEach((v, i) => {
                if (v == null) { started = false; return; }
                const x = pad.left + i * stepX;
                const y = pad.top + chartH * (1 - (v - minVal) / (maxVal - minVal));
                if (!started) { ctx.moveTo(x, y); started = true; }
                else { ctx.lineTo(x, y); }
            });
            ctx.stroke();

            pts.forEach((v, i) => {
                if (v == null) return;
                const x = pad.left + i * stepX;
                const y = pad.top + chartH * (1 - (v - minVal) / (maxVal - minVal));
                ctx.fillStyle = info.color;
                ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#4E342E';
                ctx.font = '11px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(v.toFixed(1), x, y - 8);
            });

            ctx.fillStyle = '#8D6E63';
            ctx.font = '11px sans-serif';
            ctx.textAlign = 'center';
            const showEvery = Math.ceil(labels.length / 6);
            labels.forEach((l, i) => {
                if (i % showEvery !== 0 && i !== labels.length - 1) return;
                const x = pad.left + i * stepX;
                ctx.fillText(l, x, H - pad.bottom + 18);
            });
        }

        function groupData(mode) {
            const sorted = [...cards].sort((a, b) => new Date(a.date) - new Date(b.date));
            if (mode === 'day') {
                return {
                    labels: sorted.map(c => c.date.slice(5)),
                    data: {
                        weight: sorted.map(c => c.weight),
                        bust: sorted.map(c => c.bust),
                        waist: sorted.map(c => c.waist),
                        hip: sorted.map(c => c.hip)
                    }
                };
            }

            const groups = {};
            sorted.forEach(c => {
                const d = new Date(c.date);
                let key;
                if (mode === 'week') {
                    const weekStart = new Date(d);
                    weekStart.setDate(d.getDate() - d.getDay());
                    key = weekStart.toISOString().split('T')[0];
                } else {
                    key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
                }
                if (!groups[key]) groups[key] = [];
                groups[key].push(c);
            });

            const labels = Object.keys(groups).sort();
            const avg = arr => {
                const valid = arr.filter(v => v != null);
                return valid.length ? valid.reduce((a,b)=>a+b,0)/valid.length : null;
            };
            return {
                labels: labels.map(k => mode === 'week' ? k.slice(5) : k),
                data: {
                    weight: labels.map(k => avg(groups[k].map(c => c.weight))),
                    bust: labels.map(k => avg(groups[k].map(c => c.bust))),
                    waist: labels.map(k => avg(groups[k].map(c => c.waist))),
                    hip: labels.map(k => avg(groups[k].map(c => c.hip)))
                }
            };
        }

        window.addEventListener('resize', () => { if(document.getElementById('chartModal').classList.contains('active')) drawChart(); });
        document.querySelectorAll('.modal-overlay').forEach(el => {
            el.addEventListener('click', e => { if (e.target === el) el.classList.remove('active'); });
        });

        loadCards();
    </script>
</body>
